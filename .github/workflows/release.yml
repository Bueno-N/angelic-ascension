name: Gerar APK de release (manual)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Nome da versão (ex.: 1.0.0)"
        required: true
        default: "1.0.0"
      version_code:
        description: "Código da versão (inteiro, sempre maior que o anterior)"
        required: true
        default: "1"

env:
  GODOT_VERSION: "4.3"
  GODOT_CHANNEL: stable

jobs:
  release:
    name: APK de release assinado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache do Godot e templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-export-${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}-linux

      - run: bash tools/ci/setup_godot.sh
      - run: bash tools/ci/setup_templates.sh
      - run: bash tools/ci/setup_android.sh

      - name: Restaurar keystore de release (secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Secret ANDROID_KEYSTORE_BASE64 ausente (veja docs/RELEASE.md)"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Testes, smoke e export de release
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: bash tools/ci/build_release.sh

      - name: Publicar APK de release
        uses: actions/upload-artifact@v4
        with:
          name: AngelicAscension-release-apk
          path: build/AngelicAscension-release.apk
          if-no-files-found: error

      - name: Enviar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-release
          path: |
            build/*.log
            build/*.txt
          if-no-files-found: warn
